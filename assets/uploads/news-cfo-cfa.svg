<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CFO ou CFA : quelle différence ?</title>
  <desc id="desc">Visuel pédagogique SERILEC distinguant le courant fort du courant faible.</desc>
  <rect width="1600" height="900" fill="#0b0f14"/>
  <rect x="70" y="70" width="1460" height="760" rx="34" fill="#111821" stroke="#2a3542" stroke-width="2"/>
  <text x="120" y="170" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700">CFO OU CFA ?</text>
  <text x="120" y="228" fill="#aab6c3" font-family="Arial, Helvetica, sans-serif" font-size="30">Deux familles indispensables au fonctionnement d’un bâtiment</text>

  <rect x="120" y="310" width="620" height="390" rx="28" fill="#18212c"/>
  <text x="175" y="395" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700">CFO</text>
  <text x="175" y="447" fill="#d4dde6" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">COURANT FORT</text>
  <text x="175" y="515" fill="#d4dde6" font-family="Arial, Helvetica, sans-serif" font-size="27">Alimenter le bâtiment</text>
  <text x="175" y="570" fill="#9fb0c0" font-family="Arial, Helvetica, sans-serif" font-size="24">Éclairage • Prises • TGBT</text>
  <text x="175" y="610" fill="#9fb0c0" font-family="Arial, Helvetica, sans-serif" font-size="24">Tableaux • Équipements</text>
  <path d="M615 405h34l-28 55h31l-72 92 22-64h-31z" fill="#ffffff"/>

  <rect x="860" y="310" width="620" height="390" rx="28" fill="#18212c"/>
  <text x="915" y="395" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700">CFA</text>
  <text x="915" y="447" fill="#d4dde6" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">COURANT FAIBLE</text>
  <text x="915" y="515" fill="#d4dde6" font-family="Arial, Helvetica, sans-serif" font-size="27">Connecter &amp; sécuriser</text>
  <text x="915" y="570" fill="#9fb0c0" font-family="Arial, Helvetica, sans-serif" font-size="24">VDI • SSI • Interphonie</text>
  <text x="915" y="610" fill="#9fb0c0" font-family="Arial, Helvetica, sans-serif" font-size="24">Contrôle d’accès • Réseaux</text>
  <circle cx="1350" cy="438" r="16" fill="#ffffff"/>
  <circle cx="1350" cy="438" r="48" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.8"/>
  <circle cx="1350" cy="438" r="82" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.45"/>

  <text x="120" y="778" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">SERILEC</text>
  <text x="300" y="778" fill="#8f9baa" font-family="Arial, Helvetica, sans-serif" font-size="25">Courants forts • Courants faibles • Études • Réalisation • Maintenance</text>
</svg>
