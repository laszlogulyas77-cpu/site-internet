  <text x="94" y="410" font-family="Arial,Helvetica,sans-serif" font-size="124" font-weight="900" fill="#fff200">24</text>
  <text x="270" y="388" font-family="Arial,Helvetica,sans-serif" font-size="52" font-weight="850" fill="#fff">BORNES IRVE</text>
  <text x="274" y="438" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="650" fill="#d9e7f7">pour un ensemble de bureaux de 10 000 m²</text>
