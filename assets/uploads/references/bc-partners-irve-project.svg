<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">BC Partners - 24 bornes IRVE pour 10 000 mètres carrés de bureaux</title>
  <desc id="desc">Visuel technique SERILEC créé pour illustrer la référence IRVE BC Partners en l'absence de photographies publiques vérifiables du chantier.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061a31"/>
      <stop offset=".62" stop-color="#123f70"/>
      <stop offset="1" stop-color="#376caf"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfeaf5"/>
      <stop offset="1" stop-color="#8fb2d5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#00152c" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g opacity=".14" stroke="#fff" stroke-width="2">
    <path d="M0 160h1600M0 320h1600M0 480h1600M0 640h1600M0 800h1600"/>
    <path d="M160 0v1000M320 0v1000M480 0v1000M640 0v1000M800 0v1000M960 0v1000M1120 0v1000M1280 0v1000M1440 0v1000"/>
