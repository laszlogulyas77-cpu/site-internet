name: Veille LinkedIn SERILEC via Windsor.ai

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-linkedin-news.yml'
      - 'scripts/sync-windsor-linkedin.py'
  schedule:
    - cron: '23 6 * * *'  # chaque matin, UTC

permissions:
  contents: write

concurrency:
  group: linkedin-serilec-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Se caler sur main
        shell: bash
        run: git pull --rebase origin main

      - name: Tester la validation des données Windsor
        shell: bash
        run: python3 scripts/sync-windsor-linkedin.py --self-test

      - name: Récupérer les posts SERILEC depuis Windsor.ai (lecture seule)
        shell: bash
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          WINDSOR_LINKEDIN_ACCOUNT_ID: ${{ secrets.WINDSOR_LINKEDIN_ACCOUNT_ID }}
        run: |
          test -n "$WINDSOR_API_KEY" || { echo '::error::Secret WINDSOR_API_KEY manquant dans GitHub Actions'; exit 1; }
          python3 scripts/sync-windsor-linkedin.py

      - name: Valider le JSON
        shell: bash
        run: |
          python3 -m json.tool data/news.json > /dev/null
          if [ -f data/linkedin-pending.json ]; then
            python3 -m json.tool data/linkedin-pending.json > /dev/null
          fi

      - name: Committer uniquement si nécessaire
        id: publish
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/linkedin-pending.json)" ]; then
            echo "Aucune modification à publier."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/linkedin-pending.json
          git commit -m "Veille LinkedIn SERILEC : nouvelles URLs en attente de vérification"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Nouvelle tentative de push ($attempt/3)"
            sleep $((attempt * 3))
          done

          echo "::error::Impossible de pousser la synchronisation LinkedIn sur main après 3 tentatives."
          exit 1

