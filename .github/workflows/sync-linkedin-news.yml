name: Synchroniser LinkedIn SERILEC

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: linkedin-serilec-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Se caler sur main
        shell: bash
        run: git pull --rebase origin main

      - name: Rechercher et synchroniser les posts LinkedIn
        shell: bash
        run: python3 scripts/sync-linkedin-news.py

      - name: Valider le JSON
        shell: bash
        run: python3 -m json.tool data/news.json > /dev/null

      - name: Committer uniquement si nécessaire
        id: publish
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/news.json assets/uploads/linkedin)" ]; then
            echo "Aucune modification à publier."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json assets/uploads/linkedin
          git commit -m "Synchroniser LinkedIn SERILEC"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Nouvelle tentative de push ($attempt/3)"
            sleep $((attempt * 3))
          done

          echo "::error::Impossible de pousser la synchronisation LinkedIn sur main après 3 tentatives."
          exit 1

      - name: Déclencher le déploiement OVH
        if: steps.publish.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-ovh.yml --ref main

      - name: Déclencher GitHub Pages
        if: steps.publish.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
