name: Déployer le site SERILEC

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Créer la version du déploiement
        shell: bash
        run: |
          mkdir -p data
          printf '{"sha":"%s","deployed_at":"%s"}\n' "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > data/deploy-version.json

      - name: Activer l’actualisation automatique
        shell: bash
        run: |
          VERSION="${GITHUB_SHA:0:10}"
          while IFS= read -r -d '' file; do
            if ! grep -q 'assets/js/live-refresh.js' "$file"; then
              sed -i "s#</body>#<script src=\"assets/js/live-refresh.js?v=${VERSION}\"></script></body>#" "$file"
            fi
          done < <(find . -maxdepth 1 -type f -name '*.html' -print0)

      - name: Préparer les fichiers du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
