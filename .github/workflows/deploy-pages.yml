name: Déployer le site SERILEC

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Créer la version du déploiement
        shell: bash
        run: |
          mkdir -p data
          printf '{"sha":"%s","deployed_at":"%s"}\n' "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > data/deploy-version.json

      - name: Préparer immédiatement la photo d’accueil du CMS
        shell: bash
        run: |
          HERO_IMAGE="$(jq -r '.home.hero_image // empty' data/site.json)"
          if [ -n "$HERO_IMAGE" ] && [ -f "$HERO_IMAGE" ]; then
            python3 - "$HERO_IMAGE" <<'PY'
          import sys
          from pathlib import Path

          hero = sys.argv[1].replace("'", "%27")
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          preload = f'<link rel="preload" as="image" href="{hero}">'
          style = (
              '<style id="cms-hero-initial">'
              '.hero{background-image:linear-gradient(90deg,rgba(0,20,43,.98) 0%,rgba(0,26,54,.9) 42%,rgba(0,26,54,.28) 76%),'
              f"url('{hero}')!important;background-position:center!important;background-size:cover!important}}"
              '</style>'
          )
          if 'id="cms-hero-initial"' not in html:
              html = html.replace('</head>', preload + style + '</head>')
          path.write_text(html, encoding='utf-8')
          PY
          fi

      - name: Activer les contenus complémentaires et l’actualisation automatique
        shell: bash
        run: |
          VERSION="${GITHUB_SHA:0:10}"
          while IFS= read -r -d '' file; do
            if ! grep -q 'assets/js/project-content-merge.js' "$file"; then
              sed -i "s#</body>#<script src=\"assets/js/project-content-merge.js?v=${VERSION}\"></script></body>#" "$file"
            fi
            if ! grep -q 'assets/js/royan-photo-fix.js' "$file"; then
              sed -i "s#</body>#<script src=\"assets/js/royan-photo-fix.js?v=${VERSION}\"></script></body>#" "$file"
            fi
            if ! grep -q 'assets/js/social-links.js' "$file"; then
              sed -i "s#</body>#<script src=\"assets/js/social-links.js?v=${VERSION}\"></script></body>#" "$file"
            fi
            if ! grep -q 'assets/js/news-nav.js' "$file"; then
              sed -i "s#</body>#<script src=\"assets/js/news-nav.js?v=${VERSION}\"></script></body>#" "$file"
            fi
            if ! grep -q 'assets/js/live-refresh.js' "$file"; then
              sed -i "s#</body>#<script src=\"assets/js/live-refresh.js?v=${VERSION}\"></script></body>#" "$file"
            fi
          done < <(find . -maxdepth 1 -type f -name '*.html' -print0)

      - name: Préparer les fichiers du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
