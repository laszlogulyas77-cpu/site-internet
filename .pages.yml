media:
  - name: images
    label: Photos et logos du site
    input: assets/uploads
    output: assets/uploads
    categories: [image]
    extensions: [jpg, jpeg, png, webp, avif, svg]
    rename: safe

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "contenu: ajout de {path}"
      update: "contenu: mise à jour de {path}"
      delete: "contenu: suppression de {path}"

content:
  - name: site
    label: Réglages et textes principaux
    type: file
    path: data/site.json
    format: json
    operations:
      delete: false
    fields:
      - {name: company_name, label: Nom de l’entreprise, type: string, required: true}
      - name: logo
        label: Logo principal
        type: image
        required: true
        options: {media: images}
      - {name: email, label: Email de contact, type: string, required: true}
      - {name: phone, label: Téléphone, type: string}
      - {name: address, label: Adresse, type: text}
      - {name: location_label, label: Zone d’intervention affichée, type: string}
      - {name: footer_description, label: Présentation dans le pied de page, type: text}
      - name: home
        label: Page d’accueil
        type: object
        fields:
          - {name: hero_eyebrow, label: Surtitre principal, type: string}
          - {name: hero_title, label: Titre principal, type: string}
          - {name: hero_highlight, label: Partie du titre en couleur, type: string}
          - {name: hero_lead, label: Texte d’introduction, type: text}
          - {name: about_eyebrow, label: Surtitre de présentation, type: string}
          - {name: about_title, label: Titre de présentation, type: string}
          - {name: about_text, label: Texte de présentation, type: text}
          - name: stats
            label: Chiffres clés
            type: object
            fields:
              - name: stat_1
                label: Chiffre clé 1
                type: object
                fields:
                  - {name: value, label: Valeur, type: string}
                  - {name: label, label: Texte, type: string}
              - name: stat_2
                label: Chiffre clé 2
                type: object
                fields:
                  - {name: value, label: Valeur, type: string}
                  - {name: label, label: Texte, type: string}
              - name: stat_3
                label: Chiffre clé 3
                type: object
                fields:
                  - {name: value, label: Valeur, type: string}
                  - {name: label, label: Texte, type: string}
              - name: stat_4
                label: Chiffre clé 4
                type: object
                fields:
                  - {name: value, label: Valeur, type: string}
                  - {name: label, label: Texte, type: string}
          - {name: contact_eyebrow, label: Surtitre de contact, type: string}
          - {name: contact_title, label: Titre de contact, type: string}
          - {name: contact_text, label: Texte de contact, type: text}
      - name: pages
        label: En-têtes des pages
        type: object
        fields:
          - name: competences
            label: Compétences
            type: object
            fields:
              - {name: eyebrow, label: Surtitre, type: string}
              - {name: title, label: Titre, type: string}
              - {name: intro, label: Introduction, type: text}
          - name: projects
            label: Projets
            type: object
            fields:
              - {name: eyebrow, label: Surtitre, type: string}
              - {name: title, label: Titre, type: string}
              - {name: intro, label: Introduction, type: text}
          - name: partners
            label: Clients & Partenaires
            type: object
            fields:
              - {name: eyebrow, label: Surtitre, type: string}
              - {name: title, label: Titre, type: string}
              - {name: intro, label: Introduction, type: text}
          - name: news
            label: Actualités
            type: object
            fields:
              - {name: eyebrow, label: Surtitre, type: string}
              - {name: title, label: Titre, type: string}
              - {name: intro, label: Introduction, type: text}

  - name: competences
    label: Compétences
    type: file
    path: data/competences.json
    format: json
    list: true
    operations: {rename: false, delete: false}
    fields:
      - {name: number, label: Numéro, type: string, required: true}
      - {name: kicker, label: Catégorie, type: string, required: true}
      - {name: title, label: Titre, type: string, required: true}
      - {name: description, label: Description, type: text, required: true}
      - {name: bullets, label: Prestations, type: string, list: true}
      - {name: published, label: Visible sur le site, type: boolean, default: true}

  - name: projects
    label: Projets réalisés
    type: file
    path: data/projects.json
    format: json
    list: true
    operations: {rename: false, delete: false}
    fields:
      - {name: title, label: Nom du projet, type: string, required: true}
      - name: category
        label: Catégorie principale
        type: select
        required: true
        options:
          values:
            - {name: hotel, label: Hôtellerie}
            - {name: office, label: Bureaux}
            - {name: school, label: École / Enseignement}
            - {name: retail, label: Boutique / Retail}
            - {name: restaurant, label: Restaurant}
            - {name: health, label: Santé}
            - {name: premium, label: Haut de gamme / Patrimoine}
      - {name: premium, label: Afficher aussi dans Haut de gamme, type: boolean, default: false}
      - {name: category_label, label: Libellé affiché, type: string, required: true}
      - {name: location, label: Adresse / lieu, type: string}
      - {name: description, label: Mission SERILEC, type: text, required: true}
      - {name: client, label: Maître d’ouvrage / client, type: string}
      - {name: amount, label: Montant des travaux (interne, non affiché), type: string}
      - {name: year, label: Date de réalisation, type: string}
      - name: image
        label: Photo principale
        type: image
        required: true
        options: {media: images}
      - {name: alt, label: Description de la photo, type: string}
      - {name: featured, label: Afficher sur l’accueil, type: boolean, default: false}
      - {name: published, label: Visible sur le site, type: boolean, default: true}

  - name: clients
    label: Clients
    type: file
    path: data/clients.json
    format: json
    list: true
    operations: {rename: false, delete: false}
    fields:
      - {name: name, label: Nom du client, type: string, required: true}
      - {name: description, label: Description facultative, type: string}
      - {name: website, label: Site internet, type: string}
      - name: logo
        label: Logo
        type: string
        description: URL du logo ou chemin d’un fichier dans le dépôt
      - {name: published, label: Visible sur le site, type: boolean, default: true}

  - name: partners
    label: Partenaires techniques
    type: file
    path: data/partners.json
    format: json
    list: true
    operations: {rename: false, delete: false}
    fields:
      - {name: name, label: Nom, type: string, required: true}
      - {name: description, label: Domaine ou description, type: string}
      - {name: website, label: Site internet, type: string}
      - name: category
        label: Catégorie
        type: select
        options:
          values: [Fabricant, Distribution, GTB, Architecture, Bureau d’études, Intégrateur, Autre]
      - name: logo
        label: Logo facultatif
        type: string
        description: URL du logo ou chemin d’un fichier dans le dépôt
      - {name: published, label: Visible sur le site, type: boolean, default: true}

  - name: news
    label: Actualités
    type: file
    path: data/news.json
    format: json
    list: true
    operations: {rename: false, delete: false}
    fields:
      - {name: title, label: Titre, type: string, required: true}
      - name: category
        label: Catégorie
        type: select
        required: true
        options:
          values: [Chantier, Équipe, Innovation, Hôtellerie, Bureaux, Recrutement, Entreprise]
      - name: date
        label: Date
        type: date
        options: {format: yyyy-MM-dd}
      - {name: excerpt, label: Résumé, type: text, required: true}
      - name: image
        label: Image
        type: image
        required: true
        options: {media: images}
      - {name: alt, label: Description de l’image, type: string}
      - {name: link, label: Lien facultatif, type: string}
      - {name: featured, label: Mettre à la une, type: boolean, default: false}
      - {name: published, label: Visible sur le site, type: boolean, default: true}
